name: Verificações estáticas

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    env:
      TELEGRAM_TOKEN: "12345678901234567890123456789012345678"
      TELEGRAM_ALLOWED_USER_IDS: "123456789"
      SEARXNG_SECRET: "ci-only-searxng-secret"
      OPEN_WEBUI_SECRET_KEY: "ci-only-open-webui-secret"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: bot/package-lock.json

      - run: npm ci --prefix bot
      - run: npm run check --prefix bot
      - run: npm audit --prefix bot --audit-level=high

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - run: python -c "import ast, pathlib; ast.parse(pathlib.Path('whisper/main.py').read_text())"
      - run: docker compose config --quiet
