name: projetoia

services:
  whisper:
    build: ./whisper
    expose:
      - "9000"
    environment:
      WHISPER_MODEL: ${WHISPER_MODEL:-small}
    volumes:
      - whisper_models:/home/app/.cache/whisper
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9000/health', timeout=2)"]
      interval: 30s
      timeout: 5s
      start_period: 5m
      retries: 3
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  piper:
    build: ./piper
    expose:
      - "5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/info', timeout=2)"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  valkey:
    image: docker.io/valkey/valkey:9-alpine
    command: ["valkey-server", "--save", "60", "1", "--loglevel", "warning"]
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 15s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  searxng:
    image: docker.io/searxng/searxng:latest
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:?Gere SEARXNG_SECRET em .env}
      SEARXNG_LIMITER: "true"
      SEARXNG_VALKEY_URL: valkey://valkey:6379/0
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
      - searxng_data:/var/cache/searxng
    depends_on:
      valkey:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  open-webui:
    image: ghcr.io/open-webui/open-webui:v0.11.4
    ports:
      - "127.0.0.1:3000:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      OLLAMA_BASE_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      WEBUI_SECRET_KEY: ${OPEN_WEBUI_SECRET_KEY:?Gere OPEN_WEBUI_SECRET_KEY em .env}
    volumes:
      - open_webui_data:/app/backend/data
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  bot:
    build: ./bot
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      TELEGRAM_TOKEN: ${TELEGRAM_TOKEN:?Configure TELEGRAM_TOKEN em .env}
      TELEGRAM_ALLOWED_USER_IDS: ${TELEGRAM_ALLOWED_USER_IDS:?Configure TELEGRAM_ALLOWED_USER_IDS em .env}
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
      WHISPER_URL: http://whisper:9000
      PIPER_URL: http://piper:5000
      SEARCH_URL: http://searxng:8080
      MEMORY_DIR: /data/memorias
    volumes:
      - bot_memory:/data
    depends_on:
      whisper:
        condition: service_healthy
      piper:
        condition: service_healthy
      searxng:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  whisper_models:
  valkey_data:
  searxng_data:
  open_webui_data:
  bot_memory:
