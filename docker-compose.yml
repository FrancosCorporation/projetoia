services:
  # TRANSCRIÇÃO (Whisper)
  whisper:
    image: onerahmet/openai-whisper-asr-webservice:latest
    container_name: whisper
    ports:
      - "9000:9000"
    environment:
      - ASR_MODEL=base
      - ASR_ENGINE=openai_whisper
    devices:
      - "/dev/dxg:/dev/dxg"
    volumes:
      - /usr/lib/wsl:/usr/lib/wsl
    restart: unless-stopped

  # INTERFACE WEB (Opcional, apontando para o Windows)
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    ports:
      - "3000:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
    volumes:
      - open-webui_data:/app/backend/data
    restart: unless-stopped

  # VOZ (Piper) - IMAGEM CORRIGIDA
  # VOZ (Piper) - Usando build local para evitar erro de download
  piper:
    build: ./piper  # <--- Use o seu Dockerfile local
    container_name: piper
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - ./piper:/quality
    # Comando para o servidor oficial que você instalou via PIP
    command: ["--model", "/quality/pt_BR-faber-medium.onnx", "--port", "5000"]

  # JARVIS (Bot Telegram)
  bot:
    build: ./bot
    container_name: telegram_bot
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - whisper
      - piper
    env_file:
      - .env
    restart: unless-stopped
    environment:
      - TZ=America/Sao_Paulo

  # BUSCA (Searxng)
  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:rw
    cap_add:
      - NET_ADMIN
    environment:
      - TZ=America/Sao_Paulo

volumes:
  open-webui_data:
  