# Configuração otimizada para o Bot Maestro
use_default_settings: true

server:
  limiter: true
  image_proxy: false
  base_url: false

search:
  formats:
    - html
    - json

valkey:
  url: valkey://valkey:6379/0

engines:
  - name: google
    engine: google
    shortcut: g
  - name: bing
    engine: bing
  - name: wikipedia
    engine: wikipedia
